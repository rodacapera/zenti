name: 🚀 Android CI/CD - Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'

      - name: ♻️ Cache de dependencias Yarn
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: 📥 Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🧹 Limpiar build anterior y daemons
        run: |
          cd android
          # Detener todos los daemons de Gradle/Kotlin
          ./gradlew --stop || true
          # Limpiar build
          ./gradlew clean || true
          # Limpiar directorios de build
          rm -rf app/build app/.cxx .gradle build || true
          # Limpiar cache de Kotlin
          rm -rf .kotlin || true
          # Limpiar cache de Gradle (solo en CI para evitar problemas)
          if [ "$CI" = "true" ]; then
            rm -rf ~/.gradle/caches/ || true
            rm -rf ~/.gradle/daemon/ || true
          fi

      - name: 🔢 Bump versionCode y versionName
        uses: chkfung/android-version-actions@v1.2.2
        with:
          gradlePath: android/app/build.gradle
          versionCode: ${{ github.run_number }}
          versionName: 1.0.${{ github.run_number }}

      - name: 🔍 Verificar configuración
        run: |
          echo "🔍 Verificando configuración..."
          echo "📦 Node version:"
          node --version
          echo "☕ Java version:"
          java -version
          echo "📋 Gradle version:"
          cd android && ./gradlew --version
          echo "📦 Verificando dependencias instaladas:"
          ls -la node_modules | head -10 || true

      - name: 🔓 Decodificar archivo release.keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: 🔐 Compilar .aab firmado (release)
        run: |
          cd android
          # Configurar variables de entorno para Gradle
          export GRADLE_OPTS="-Xmx2048m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
          export JAVA_OPTS="-Xmx2048m"
          
          # Intentar build con reintentos
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "🔄 Intento de build #$((RETRY_COUNT + 1)) de $MAX_RETRIES"
            
            if ./gradlew bundleRelease \
              -PRELEASE_KEYSTORE_PATH=release.keystore \
              -PRELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} \
              -PRELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }} \
              -PRELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }} \
              --stacktrace \
              --no-daemon \
              --no-parallel \
              -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" \
              2>&1 | tee gradle_build.log; then
              echo "✅ Build exitoso"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️ Build falló, deteniendo daemons y limpiando..."
                ./gradlew --stop || true
                rm -rf .gradle app/build || true
                sleep 5
              else
                echo "❌ Build falló después de $MAX_RETRIES intentos"
                echo "📋 Buscando errores en el log:"
                grep -i "error\|failed\|exception\|FAILURE" gradle_build.log | tail -50 || true
                exit 1
              fi
            fi
          done

      - name: 🔍 Verificar .aab generado
        run: ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: 📋 Mostrar logs de error (si falló)
        if: failure()
        run: |
          echo "📋 Buscando errores en el log de Gradle..."
          if [ -f "android/gradle_build.log" ]; then
            echo "=== Últimas 200 líneas del log ==="
            tail -200 android/gradle_build.log || true
            echo "=== Errores encontrados ==="
            grep -i "error\|failed\|exception\|FAILURE" android/gradle_build.log | tail -50 || true
          fi
          echo "=== Verificando archivos de build ==="
          ls -la android/app/build/outputs/bundle/release/ 2>/dev/null || echo "❌ No se encontró el directorio de outputs"
      
      - name: 📤 Subir artifacts (logs y .aab si existe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-production-artifacts
          path: |
            android/gradle_build.log
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: 📄 Decodificar service-account.json
        run: |
          mkdir -p android
          echo "${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > android/service-account.json

      - name: 📂 Ver contenido de service-account.json (debug)
        run: |
          echo "=== LISTA android/ ==="
          ls -l android
          echo "=== START service-account.json ==="
          sed -n '1,5p' android/service-account.json
          echo "..."
          sed -n '$p' android/service-account.json
          echo "=== END service-account.json ==="

      - name: ✅ Validar JSON
        run: |
          if jq empty android/service-account.json 2>/dev/null; then
            echo "✅ JSON válido"
          else
            echo "❌ JSON inválido o truncado"
            exit 1
          fi

      - name: 🚀 Subir a Google Play Console - PRODUCTION
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJson: android/service-account.json
          packageName: com.teranov.zentiapp
          releaseFiles: ${{ github.workspace }}/android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          changesNotSentForReview: true

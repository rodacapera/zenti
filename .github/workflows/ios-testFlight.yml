name: 🍏 iOS CI/CD - TestFlight (Manual & Validaciones)

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "ios/**"
      - "Podfile"
      - "Podfile.lock"
      - ".github/workflows/ios-testflight.yml"

jobs:
  build-and-upload-ios:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: ✅ Validar Scheme Compartido
        run: |
          echo "Schemes en workspace:"
          ls ios/Zenti.xcworkspace/xcshareddata/xcschemes
          if grep -q 'Zenti' ios/Zenti.xcworkspace/xcshareddata/xcschemes/*.xcscheme; then
            echo "✅ Encontrado ‘Zenti’ en alguno de los schemes"
          else
            echo "❌ No se encontró ‘Zenti’ en los schemes compartidos" && exit 1
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.18.1"

      - name: 📦 Cache & install JS deps
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/yarn
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --frozen-lockfile

      - name: 💾 Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}

      - name: 📦 Instalar Bundler y dependencias Ruby
        run: |
          cd ios
          gem install bundler --silent
          bundle install --jobs 4 --retry 3 --quiet

      - name: 🧨 Limpiar Pods, DerivedData y Caches
        run: |
          echo "🧹 Limpieza agresiva para evitar errores en CI..."
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ios/Pods
          rm -f ios/Podfile.lock

      - name: 📦 Instalar Pods
        run: |
          cd ios
          bundle exec pod install

      - name: 🚀 Bump version & build number
        run: |
          cd ios
          xcrun agvtool new-marketing-version 1.0.1
          xcrun agvtool new-version -all ${{ github.run_number }}
          cd ..

      - name: 🔨 Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2" # Usa Xcode 16.2 que sí soporta iOS 18.0

      - name: 📋 Ver versión de Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: 🚀 Build y subir a TestFlight con Fastlane
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          RCT_NO_LAUNCH_PACKAGER: "true" # ← CLAVE para evitar scripts innecesarios
          CI: "true" # ← CLAVE para entornos CI/CD
        run: |
          cd ios
          bundle exec fastlane beta

      - name: 🔍 Mostrar logs de Fastlane si existen
        if: failure()
        run: |
          if [ -d "/Users/runner/Library/Logs/gym" ]; then
            echo "=== Contenido de /Users/runner/Library/Logs/gym ==="
            ls -l /Users/runner/Library/Logs/gym
            cat /Users/runner/Library/Logs/gym/*.log || true
          fi
          if [ -d "ios/fastlane/logs" ]; then
            echo "=== Contenido de ios/fastlane/logs ==="
            ls -l ios/fastlane/logs
            cat ios/fastlane/logs/*.log || true
          fi

      - name: 💾 Guardar log de Fastlane
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-gym-log
          path: |
            /Users/runner/Library/Logs/gym
            ios/fastlane/logs
          if-no-files-found: warn

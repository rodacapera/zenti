name: 🍏 iOS CI/CD - TestFlight (Optimizado)

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'ios/**'
      - 'src/**'
      - 'Podfile'
      - 'Podfile.lock'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/ios-testFlight.yml'

jobs:
  build-and-upload-ios:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔨 Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: 📋 Ver versión de Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: ✅ Validar Scheme Compartido
        run: |
          echo "📂 Schemes disponibles:"
          ls ios/Zenti.xcworkspace/xcshareddata/xcschemes
          if grep -q 'Zenti' ios/Zenti.xcworkspace/xcshareddata/xcschemes/*.xcscheme; then
            echo "✅ Encontrado ‘Zenti’ en alguno de los schemes"
          else
            echo "❌ No se encontró ‘Zenti’ en los schemes compartidos" && exit 1
          fi

      # 3️⃣ Dependencias y versionado
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"

      - name: 🔗 Symlink node for React Native scripts
        run: sudo ln -sf "$(which node)" /usr/local/bin/node

      - name: 📦 Cache JS deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: 📦 Install JS deps
        run: yarn install --frozen-lockfile

      # Desactivar cache temporalmente para forzar instalación limpia
      # - name: 💾 Cache CocoaPods
      #   uses: actions/cache@v4
      #   with:
      #     path: ios/Pods
      #     key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}

      - name: 📦 Instalar Bundler y dependencias Ruby
        run: |
          cd ios
          gem install bundler --silent
          bundle install --jobs 4 --retry 3 --quiet

      - name: 📦 Limpiar e instalar Pods
        run: |
          cd ios
          # Limpiar Pods para forzar reinstalación con nueva configuración
          rm -rf Pods Podfile.lock
          # Instalar Pods con la nueva configuración de deployment target
          pod install --repo-update

      - name: 🚀 Bump version & build number
        run: |
          cd ios
          xcrun agvtool new-marketing-version 1.0.1
          xcrun agvtool new-version -all ${{ github.run_number }}
          cd ..

      - name: 🔐 Configurar Keychain para CI
        run: |
          # Crear un keychain temporal para CI
          security create-keychain -p "" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Configurar para no pedir contraseña
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain || true

      - name: 🔍 Verificar configuración antes del build
        run: |
          echo "🔍 Verificando configuración..."
          cd ios
          echo "📦 Verificando Pods instalados:"
          ls -la Pods | head -20 || true
          echo "🔐 Verificando certificados:"
          security find-identity -v -p codesigning /Users/runner/Library/Keychains/build.keychain-db || true
          echo "📱 Verificando provisioning profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          echo "📋 Verificando configuración del proyecto:"
          xcodebuild -workspace Zenti.xcworkspace -scheme Zenti -showBuildSettings 2>&1 | grep -E "IPHONEOS_DEPLOYMENT_TARGET|CODE_SIGN|PROVISIONING_PROFILE" | head -20 || true
          echo "✅ Verificación de configuración completada"

      - name: 🚀 Build y subir a TestFlight con Fastlane
        timeout-minutes: 90
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          RCT_NO_LAUNCH_PACKAGER: "true"
          CI: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "3"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
        run: |
          cd ios
          # Ejecutar fastlane con salida completa y guardar en archivo
          bundle exec fastlane beta 2>&1 | tee fastlane_output.log
          # Si falla, mostrar las últimas líneas del log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Fastlane falló. Últimas 100 líneas del log:"
            tail -100 fastlane_output.log || true
            exit 1
          fi

      - name: 🔍 Mostrar logs de error completos
        if: failure()
        run: |
          echo "📋 Mostrando logs de error..."
          if [ -f "ios/fastlane_output.log" ]; then
            echo "📄 Últimas 500 líneas de fastlane_output.log:"
            tail -500 ios/fastlane_output.log || true
          fi
          if [ -d "/Users/runner/Library/Logs/gym" ]; then
            echo "📦 Logs de gym:"
            ls -lR /Users/runner/Library/Logs/gym || true
            echo "📄 Buscando errores en los logs de gym:"
            find /Users/runner/Library/Logs/gym -name "*.log" -type f | while read logfile; do
              echo "=== $logfile ==="
              # Mostrar líneas con "error:", "Error:", "failed", "Failed"
              grep -i -A 5 -B 5 "error:\|Error:\|failed\|Failed" "$logfile" | tail -100 || true
            done
            # Mostrar las últimas líneas de cada log
            find /Users/runner/Library/Logs/gym -name "*.log" -type f -exec sh -c 'echo "=== {} ==="; tail -200 {}' \; || true
          fi
          if [ -d "ios/build/logs" ]; then
            echo "📦 Logs de build:"
            ls -lR ios/build/logs || true
            find ios/build/logs -name "*.log" -type f -exec sh -c 'echo "=== {} ==="; tail -200 {}' \; || true
          fi
          if [ -d "ios/fastlane/logs" ]; then
            echo "📦 Logs de fastlane:"
            ls -l ios/fastlane/logs || true
            find ios/fastlane/logs -name "*.log" -type f -exec tail -200 {} \; || true
          fi
          # Mostrar información del build si existe
          if [ -d "ios/build" ]; then
            echo "📦 Contenido del directorio build:"
            ls -la ios/build || true
          fi

      - name: 🧹 Limpiar Keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          security list-keychains -s login.keychain || true

      - name: 💾 Guardar logs y artifacts
        if: always()
        run: |
          echo "💾 Guardando logs..."
          mkdir -p artifacts
          
          # Copiar logs de fastlane
          if [ -f "ios/fastlane_output.log" ]; then
            cp ios/fastlane_output.log artifacts/ || true
          fi
          
          # Copiar logs de gym
          if [ -d "/Users/runner/Library/Logs/gym" ]; then
            cp -r /Users/runner/Library/Logs/gym artifacts/gym_logs || true
          fi
          
          # Copiar logs de fastlane
          if [ -d "ios/fastlane/logs" ]; then
            cp -r ios/fastlane/logs artifacts/fastlane_logs || true
          fi
          
          # Copiar logs de build
          if [ -d "ios/build/logs" ]; then
            cp -r ios/build/logs artifacts/build_logs || true
          fi
          
          # Mostrar tamaño de los logs
          du -sh artifacts/* 2>/dev/null || true

      - name: 📤 Subir artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

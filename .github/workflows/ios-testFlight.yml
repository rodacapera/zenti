name: 🍏 iOS CI/CD - TestFlight (Optimizado)

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "ios/**"
      - "src/**"
      - "Podfile"
      - "Podfile.lock"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/ios-testFlight.yml"

jobs:
  build-and-upload-ios:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔨 Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: 📋 Ver versión de Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          sudo xcode-select -s /Applications/Xcode_16.2.app
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

      - name: ✅ Validar Scheme Compartido
        run: |
          echo "📂 Schemes disponibles:"
          ls ios/Zenti.xcworkspace/xcshareddata/xcschemes
          if grep -q 'Zenti' ios/Zenti.xcworkspace/xcshareddata/xcschemes/*.xcscheme; then
            echo "✅ Encontrado ‘Zenti’ en alguno de los schemes"
          else
            echo "❌ No se encontró ‘Zenti’ en los schemes compartidos" && exit 1
          fi

      # 3️⃣ Dependencias y versionado
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"

      - name: 🔗 Symlink node for React Native scripts
        run: sudo ln -sf "$(which node)" /usr/local/bin/node

      - name: 📦 Cache JS deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: 📦 Install JS deps
        run: yarn install --frozen-lockfile

      # Desactivar cache temporalmente para forzar instalación limpia
      # - name: 💾 Cache CocoaPods
      #   uses: actions/cache@v4
      #   with:
      #     path: ios/Pods
      #     key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}

      - name: 📦 Instalar Bundler y dependencias Ruby
        run: |
          cd ios
          gem install bundler --silent
          bundle install --jobs 4 --retry 3 --quiet

      - name: 🚫 Desactivar frameworks en CI
        run: |
          echo "USE_FRAMEWORKS=" >> $GITHUB_ENV

      - name: 📦 Limpiar e instalar Pods
        run: |
          cd ios
          # Limpiar Pods para forzar reinstalación con nueva configuración
          pod deintegrate || true
          rm -rf Pods Podfile.lock
          pod cache clean --all || true
          # Instalar Pods con la nueva configuración de deployment target
          pod repo update
          pod install --clean-install --repo-update

      - name: 🚀 Bump version & build number
        run: |
          cd ios
          xcrun agvtool new-marketing-version 1.0.1
          xcrun agvtool new-version -all ${{ github.run_number }}
          cd ..

      - name: 🔐 Configurar Keychain para CI
        run: |
          # Crear un keychain temporal para CI
          security create-keychain -p "" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Configurar para no pedir contraseña
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain || true

      - name: 🔍 Verificar configuración antes del build
        run: |
          echo "🔍 Verificando configuración..."
          cd ios
          echo "📦 Verificando Pods instalados:"
          ls -la Pods | head -20 || true
          echo "🔐 Verificando certificados:"
          security find-identity -v -p codesigning /Users/runner/Library/Keychains/build.keychain-db || true
          echo "📱 Verificando provisioning profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          echo "📋 Verificando configuración del proyecto:"
          xcodebuild -workspace Zenti.xcworkspace -scheme Zenti -showBuildSettings 2>&1 | grep -E "IPHONEOS_DEPLOYMENT_TARGET|CODE_SIGN|PROVISIONING_PROFILE" | head -20 || true
          echo "✅ Verificación de configuración completada"

      - name: 🚀 Build y subir a TestFlight con Fastlane
        timeout-minutes: 90
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          RCT_NO_LAUNCH_PACKAGER: "true"
          CI: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "3"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
        run: |
          cd ios
          # Ejecutar fastlane con salida completa y guardar en archivo
          set +e  # No salir inmediatamente en error
          bundle exec fastlane beta 2>&1 | tee fastlane_output.log
          FASTLANE_EXIT_CODE=${PIPESTATUS[0]}

          if [ $FASTLANE_EXIT_CODE -ne 0 ]; then
            echo "❌ Fastlane falló con código $FASTLANE_EXIT_CODE"
            echo ""
            echo "=== Buscando errores en fastlane_output.log ==="
            grep -i -A 10 -B 5 "error:\|failed\|FAILED\|Error building" fastlane_output.log | tail -100 || true
            echo ""
            echo "=== Últimas 200 líneas de fastlane_output.log ==="
            tail -200 fastlane_output.log || true
            echo ""
            echo "=== Buscando logs de xcodebuild ==="
            # Leer el log directamente desde build/logs (ios) o fastlane/build/logs
            LOG_FILE="ios/build/logs/Zenti-Zenti.log"
            if [ -f "$LOG_FILE" ]; then
              echo "✅ Encontrado log en: $LOG_FILE"
              echo "📏 Tamaño del archivo:"
              ls -lh "$LOG_FILE" || true
              echo ""
              echo "=== BUSCANDO ERRORES EN EL LOG ==="
              echo "Buscando líneas con 'error:', 'failed', 'FAILED', 'CompileC'..."
              grep -i -E "error:|failed|FAILED|CompileC.*failed|The following build commands failed" "$LOG_FILE" | tail -50 || true
              echo ""
              echo "=== ÚLTIMAS 300 LÍNEAS DEL LOG (donde suelen estar los errores) ==="
              tail -300 "$LOG_FILE" || true
              echo ""
              echo "=== BUSCANDO ERRORES ESPECÍFICOS DE COMPILACIÓN ==="
              grep -i -A 30 -B 5 "error:\|failed\|FAILED\|CompileC.*failed\|The following build commands failed\|Command.*failed" "$LOG_FILE" | tail -300 || true
            else
              echo "⚠️ No se encontró $LOG_FILE"
              echo "Buscando en otros lugares..."
              find ios/build/logs -name "*.log" -type f 2>/dev/null | head -5 | while read f; do
                echo "=== Archivo encontrado: $f ==="
                ls -lh "$f" || true
                echo "=== Últimas 200 líneas de $f ==="
                tail -200 "$f" || true
                echo ""
              done
              # Buscar en ios/fastlane/build/logs
              if [ -d "ios/fastlane/build/logs" ]; then
                echo "📂 Contenido de ios/fastlane/build/logs:"
                ls -lh ios/fastlane/build/logs/ || true
                find ios/fastlane/build/logs -name "*.log" -type f 2>/dev/null | head -5 | while read f; do
                  echo "=== Archivo encontrado: $f ==="
                  ls -lh "$f" || true
                  echo "=== Últimas 200 líneas de $f ==="
                  tail -200 "$f" || true
                  echo ""
                done
              fi
            fi
            # Buscar en el directorio de gym también
            if [ -d "/Users/runner/Library/Logs/gym" ]; then
              echo "=== Buscando en /Users/runner/Library/Logs/gym ==="
              find /Users/runner/Library/Logs/gym -name "*.log" -type f 2>/dev/null | head -3 | while read logfile; do
                echo "=== Errores en $logfile ==="
                grep -i -E "error:|failed|FAILED|CompileC.*failed|The following build commands failed" "$logfile" | tail -50 || true
                echo "=== Últimas 200 líneas de $logfile ==="
                tail -200 "$logfile" || true
                echo ""
              done
            fi
            exit $FASTLANE_EXIT_CODE
          fi

      - name: 🔍 Mostrar logs de error completos
        if: failure()
        run: |
          echo "📋 Mostrando logs de error completos..."
          echo ""

          # Buscar y leer el log de xcodebuild
          echo "=== BUSCANDO LOG DE XCODEBUILD ==="
          if [ -d "ios/build/logs" ]; then
            echo "📂 Contenido de ios/build/logs:"
            ls -lh ios/build/logs/ || true
            echo ""
            
            # Buscar todos los archivos .log
            for log_file in ios/build/logs/*.log; do
              if [ -f "$log_file" ]; then
                echo "📄 === ANALIZANDO: $log_file ==="
                echo "Tamaño: $(ls -lh "$log_file" | awk '{print $5}')"
                echo ""
                echo "--- ERRORES ENCONTRADOS ---"
                grep -i -E "error:|failed|FAILED|CompileC.*failed|The following build commands failed|Command.*failed" "$log_file" | tail -100 || true
                echo ""
                echo "--- ÚLTIMAS 400 LÍNEAS (donde suelen estar los errores finales) ---"
                tail -400 "$log_file" || true
                echo ""
                echo "=========================================="
                echo ""
              fi
            done
          fi

          # También buscar en fastlane_output.log
          if [ -f "ios/fastlane_output.log" ]; then
            echo "=== FASTLANE OUTPUT LOG ==="
            echo "Últimas 300 líneas:"
            tail -300 ios/fastlane_output.log || true
            echo ""
          fi

          # Buscar en gym logs
          if [ -d "/Users/runner/Library/Logs/gym" ]; then
            echo "=== GYM LOGS ==="
            find /Users/runner/Library/Logs/gym -name "*.log" -type f 2>/dev/null | head -3 | while read logfile; do
              echo "📄 $logfile"
              tail -300 "$logfile" || true
              echo ""
            done
          fi

      - name: 🧹 Limpiar Keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          security list-keychains -s login.keychain || true

      - name: 💾 Guardar logs y artifacts
        if: always()
        run: |
          echo "💾 Guardando logs y artifacts..."
          mkdir -p artifacts

          # Copiar logs de fastlane
          if [ -f "ios/fastlane_output.log" ]; then
            echo "📋 Copiando fastlane_output.log..."
            cp ios/fastlane_output.log artifacts/ || true
          fi

          # Copiar logs de build (el más importante)
          if [ -d "ios/build/logs" ]; then
            echo "📋 Copiando logs de build..."
            cp -r ios/build/logs artifacts/build_logs || true
            # También copiar el log completo si existe
            find ios/build/logs -name "*.log" -type f -exec cp {} artifacts/ \; || true
          fi
          # Copiar logs si se generaron en ios/fastlane/build/logs
          if [ -d "ios/fastlane/build/logs" ]; then
            echo "📋 Copiando logs desde ios/fastlane/build/logs..."
            mkdir -p artifacts/fastlane_build_logs
            cp -r ios/fastlane/build/logs artifacts/fastlane_build_logs || true
            find ios/fastlane/build/logs -name "*.log" -type f -exec cp {} artifacts/ \; || true
          fi

          # Copiar logs de gym
          if [ -d "/Users/runner/Library/Logs/gym" ]; then
            echo "📋 Copiando logs de gym..."
            cp -r /Users/runner/Library/Logs/gym artifacts/gym_logs || true
          fi

          # Copiar logs de fastlane
          if [ -d "ios/fastlane/logs" ]; then
            echo "📋 Copiando logs de fastlane..."
            cp -r ios/fastlane/logs artifacts/fastlane_logs || true
          fi

          # Mostrar qué se guardó
          echo "📦 Contenido de artifacts:"
          ls -lhR artifacts/ || true
          echo ""
          echo "📏 Tamaño de artifacts:"
          du -sh artifacts/* 2>/dev/null || true

      - name: 📤 Subir artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

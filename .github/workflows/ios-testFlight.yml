name: 📦 iOS TestFlight Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-13

    steps:
      - name: 🧩 Checkout repositorio
        uses: actions/checkout@v4

      - name: ⬇️ Instalar Ruby y Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true

      - name: 🧨 Limpiar Pods, DerivedData y Caches
        run: |
          echo "🧹 Limpieza agresiva para evitar errores en CI..."
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ios/Pods

      - name: 💾 Cache de dependencias CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 📦 Instalar dependencias iOS
        run: |
          cd ios
          pod install

      - name: 🔐 Descargar certificados con Match
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          CI: true
        run: |
          cd ios
          bundle exec fastlane match appstore --readonly --type appstore --team-id "$APPLE_DEVELOPMENT_TEAM_ID"

      - name: 🚀 Build y subir a TestFlight con Fastlane
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          cd ios
          bundle exec fastlane beta
